name: Data Quality Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/data_analyzer.py'
      - 'test/test_data_analyzer.py'
      - 'data/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Run Data Analyzer Tests
      run: pytest test/test_data_analyzer.py -v
      
    - name: Test on sample data
      run: |
        python src/data_analyzer.py data/raw/sample_clean.csv reports/test_clean.json
        python src/data_analyzer.py data/raw/sample_with_issues.csv reports/test_issues.json
        
    - name: Notify on success
      if: success()
      run: echo "Data Quality Tests passed successfully"
      
    - name: Notify on failure
      if: failure()
      run: echo "Data Quality Tests failed"